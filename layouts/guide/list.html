{{ define "main" }}
<article class="law guide">
    <h1>{{ .Title }}</h1>
    {{ .Content }}
    <ul class="laws-toc guide-toc">
        {{- range .Pages.ByWeight }}
        <li><a href="{{ .RelPermalink }}">{{ with .Params.num }}<span class="n">{{ . }}</span> {{ end }}{{ .Params.short }}</a></li>
        {{- end }}
    </ul>
</article>
{{ end }}
