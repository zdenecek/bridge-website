{{- if .IsTranslated -}}
<nav id="language-switcher" title="{{ i18n "change-language" }}">
    {{- range $i, $l := site.Languages }}
    {{- if $i }}<span class="sep">·</span>{{ end }}
    {{- if eq $l.Lang $.Lang }}
    <span class="current" lang="{{ $l.Lang }}">{{ $l.Lang }}</span>
    {{- else }}{{ range where $.Translations "Lang" $l.Lang }}
    <a href="{{ .RelPermalink }}" hreflang="{{ .Lang }}" lang="{{ .Lang }}">{{ .Lang }}</a>
    {{- end }}{{ end }}
    {{- end }}
</nav>
{{- end }}
